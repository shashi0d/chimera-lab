[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI Depends() idiom. The rest are style noise for this codebase.
ignore = ["B008", "E501", "UP042", "ASYNC109", "ASYNC240", "B905"]
